<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 36" width="32" height="36" fill="none">
    <defs>
        <!-- Outer Glow Filter -->
        <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="1.8" result="blur1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Inner Body Gradient (Dark Metallic Charcoal with 3D Bevel Highlight) -->
        <linearGradient id="body-gradient" x1="2" y1="2" x2="24" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#343a44" />
            <stop offset="35%" stop-color="#222730" />
            <stop offset="70%" stop-color="#15191f" />
            <stop offset="100%" stop-color="#0b0e12" />
        </linearGradient>

        <!-- Accent Blue Edge Gradient -->
        <linearGradient id="edge-gradient" x1="2" y1="2" x2="24" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00d8ff" />
            <stop offset="45%" stop-color="#0088ff" />
            <stop offset="100%" stop-color="#0055d4" />
        </linearGradient>
    </defs>

    <!-- Neon Cyan Outer Glow Bloom -->
    <path d="M 2 2 L 24 23 L 12 24 L 2 34 Z"
          fill="none"
          stroke="#00b4ff"
          stroke-width="3"
          stroke-linejoin="round"
          stroke-linecap="round"
          filter="url(#neon-glow)"
          opacity="0.8" />

    <!-- Solid Stealth Body -->
    <path d="M 2 2 L 24 23 L 12 24 L 2 34 Z"
          fill="url(#body-gradient)" />

    <!-- Crisp Glowing Neon Outline -->
    <path d="M 2 2 L 24 23 L 12 24 L 2 34 Z"
          fill="none"
          stroke="url(#edge-gradient)"
          stroke-width="1.8"
          stroke-linejoin="round"
          stroke-linecap="round" />
</svg>
